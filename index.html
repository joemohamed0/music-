<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My VPN-Friendly Jukebox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="player-container">
        <h1>🎵 Universal Music Player</h1>
        <p>Streaming tracks globally using VPN-safe SoundCloud layers!</p>
        
        <div class="search-box">
            <input type="text" id="songQuery" placeholder="Type any track or artist name...">
            <button onclick="searchAndPlay()">Play Song</button>
        </div>

        <div class="player-wrapper">
            <h3 id="trackTitle">Ready to stream</h3>
            <!-- Embeds a clean SoundCloud widget frame -->
            <iframe id="scPlayer" width="100%" height="166" scrolling="no" frameborder="no" allow="autoplay" src=""></iframe>
        </div>
    </div>

    <script>
        function searchAndPlay() {
            const query = document.getElementById('songQuery').value;
            const trackTitle = document.getElementById('trackTitle');
            const player = document.getElementById('scPlayer');

            if (!query) {
                alert('Please type a song name first!');
                return;
            }
            
            trackTitle.innerText = `Searching for: "${query}"...`;
            
            // Re-route the text query through SoundCloud's official embedded widget search utility
            const formattedQuery = encodeURIComponent(query);
            const streamUrl = `https://soundcloud.com{formattedQuery}&auto_play=true&show_teaser=false&visual=false`;
            
            player.src = streamUrl;
        }

        document.getElementById('songQuery').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                searchAndPlay();
            }
        });
    </script>
</body>
</html>
